[project]
name = "sandbox-runner"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server that securely executes Python and C++ code snippets inside isolated, ephemeral Docker containers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1.0",
    "mcp[cli]>=1.28.1",
]

[project.scripts]
sandbox-runner = "sandbox_runner.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_runner"]
